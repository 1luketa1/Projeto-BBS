syntax = "proto3";

package bbs;

option java_package = "bbs.proto";
option java_multiple_files = true;

enum Status {
  OK = 0;
  ERROR = 1;
}

message Envelope {
  int64 timestamp = 1;
  int64 logical_clock = 2;

  oneof body {
    LoginRequest         login_req          = 10;
    LoginReply           login_rep          = 11;
    CreateChannelRequest create_channel_req = 12;
    CreateChannelReply   create_channel_rep = 13;
    ListChannelsRequest  list_channels_req  = 14;
    ListChannelsReply    list_channels_rep  = 15;
    ErrorReply           error_rep          = 16;
    PublishRequest       publish_req        = 17;
    PublishReply         publish_rep        = 18;
    ChannelMessage       channel_msg        = 19;
    RankRequest          rank_req           = 20;
    RankReply            rank_rep           = 21;
    ListServersRequest   list_servers_req   = 22;
    ListServersReply     list_servers_rep   = 23;
    HeartbeatRequest     heartbeat_req      = 24;
    HeartbeatReply       heartbeat_rep      = 25;
    ClockRequest         clock_req          = 26;
    ClockReply           clock_rep          = 27;
    ElectionRequest      election_req       = 28;
    ElectionReply        election_rep       = 29;
    CoordinatorMessage   coordinator_msg    = 30;
    ChannelReplicated    channel_replicated = 31;
    SyncChannelsRequest  sync_channels_req  = 32;
    SyncChannelsReply    sync_channels_rep  = 33;
  }
}

// --- Login ---
message LoginRequest { string username = 1; }
message LoginReply {
  Status status = 1;
  string error  = 2;
}

// --- Criação de canal ---
message CreateChannelRequest {
  string channel  = 1;
  string username = 2;
}
message CreateChannelReply {
  Status status = 1;
  string error  = 2;
}

// --- Listagem de canais ---
message ListChannelsRequest {}
message ListChannelsReply { repeated string channels = 1; }

// --- Erro genérico ---
message ErrorReply { string error = 1; }

message PublishRequest {
  string channel  = 1;
  string username = 2;  // autor da mensagem
  string text     = 3;
}

message PublishReply {
  Status status = 1;
  string error  = 2;    // ex.: "canal não existe"
}

message ChannelMessage {
  string channel  = 1;
  string username = 2;
  string text     = 3;
}

message RankReply {
  Status status = 1;
  int32  rank   = 2;
  string error  = 3;
}

message ServerInfo {
  string name = 1;
  int32  rank = 2;
}
message ListServersRequest {}
message ListServersReply { repeated ServerInfo servers = 1; }

message HeartbeatRequest { string name = 1; }
message HeartbeatReply {
  reserved 2;
  Status status = 1;
  string error  = 3;
}

message ClockRequest {
  string name     = 1;
  int64  clock_ms = 2;
}

message ClockReply {
  Status status       = 1;
  int64  correct_time = 2;
  string error        = 3;
}

message ElectionRequest {
  string name = 1;
  int32  rank = 2;
}
message ElectionReply {
  Status status = 1;
  string error  = 2;
}

message CoordinatorMessage {
  string name = 1;
  int32 rank = 2;
}

// =====================================================================
// REPLICAÇÃO DE CANAIS entre servidores
// =====================================================================

message ChannelInfo {
  string name       = 1;
  string created_by = 2;
  int64  created_at = 3;  // epoch em ms
}

// Publicado no tópico replication quando um servidor cria um canal
message ChannelReplicated {
  string origin     = 1;  // servidor que criou (ele ignora o próprio eco)
  string name       = 2;
  string created_by = 3;
  int64  created_at = 4;
}

// REQ direto entre servidores (porta 5560)
message SyncChannelsRequest { string name = 1; }   // name = quem está pedindo
message SyncChannelsReply { repeated ChannelInfo channels = 1; }
