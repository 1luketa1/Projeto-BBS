services:
  reference:
    build: { context: ., dockerfile: reference/Dockerfile }
    environment:
      REFERENCE_PORT: "5559"
      HEARTBEAT_TIMEOUT_SECONDS: "30"

  broker:
    build: { context: ., dockerfile: broker/Dockerfile }

  proxy:
    build: { context: ., dockerfile: proxy/Dockerfile }

  server1:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      SERVER_NAME: server1
      BROKER_ADDR: tcp://broker:5556
      PUB_ADDR: tcp://proxy:5557
      SUB_ADDR: tcp://proxy:5558
      REFERENCE_ADDR: tcp://reference:5559
      PEER_PORT: "5560"
      DB_PATH: /data/server.db
      HEARTBEAT_EVERY: "10"
      CLOCK_SYNC_EVERY: "15"
      REPLICATION_SYNC_EVERY: "20"
      SERVER_CLOCK_SKEW_MS: "3000"
    volumes:
      - server1_data:/data
    depends_on: [reference, broker, proxy]

  server2:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      SERVER_NAME: server2
      BROKER_ADDR: tcp://broker:5556
      PUB_ADDR: tcp://proxy:5557
      SUB_ADDR: tcp://proxy:5558
      REFERENCE_ADDR: tcp://reference:5559
      PEER_PORT: "5560"
      DB_PATH: /data/server.db
      HEARTBEAT_EVERY: "10"
      CLOCK_SYNC_EVERY: "15"
      REPLICATION_SYNC_EVERY: "20"
      SERVER_CLOCK_SKEW_MS: "-2000"     # 2 s atrasado (demonstração)
    volumes:
      - server2_data:/data
    depends_on: [reference, broker, proxy]

  # ---- modelo para um terceiro servidor ------------------
  # 1) copie o bloco do server2 trocando "server2" por "server3" em TRÊS lugares:
  #    nome do serviço, SERVER_NAME e o volume;
  # 2) declare o volume server3_data na seção "volumes:" no fim do arquivo.

  client:
    build: { context: ., dockerfile: client/Dockerfile }
    environment:
      BROKER_ADDR: tcp://broker:5555
      SUB_ADDR: tcp://proxy:5558
      MIN_CHANNELS: "5"
      MIN_SUBSCRIPTIONS: "3"
      BURST_SIZE: "10"
      MESSAGE_INTERVAL_MS: "1000"
    deploy:
      replicas: 3
    depends_on: [broker, proxy, server1, server2]

volumes:
  server1_data:
  server2_data:
  # server3_data:
