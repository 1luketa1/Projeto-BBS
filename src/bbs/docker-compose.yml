# Orquestração do BBS - Partes 1, 2 e 3.
#   docker compose up --build --no-log-prefix                  -> referência + broker + proxy + 1 servidor + 3 bots
#   docker compose --profile multi up --build --no-log-prefix  -> adiciona o server2
services:

  # Parte 3: serviço de referência (rank, lista de servidores, heartbeat e hora correta).
  # Só conversa com os servidores; os bots não o conhecem.
  reference:
    build: { context: ., dockerfile: reference/Dockerfile }
    environment:
      REFERENCE_PORT: "5559"
      HEARTBEAT_TIMEOUT_SECONDS: "30"   # sem heartbeat por este tempo = removido da lista

  # Intermediário REQ/REP (ROUTER/DEALER). Único endereço que os clientes usam para pedidos.
  broker:
    build: { context: ., dockerfile: broker/Dockerfile }

  # Proxy Pub/Sub (XSUB :5557 para publicadores, XPUB :5558 para assinantes).
  proxy:
    build: { context: ., dockerfile: proxy/Dockerfile }

  # Servidor 1 - banco SQLite próprio, em volume próprio.
  server1:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      SERVER_NAME: server1
      BROKER_ADDR: tcp://broker:5556
      PUB_ADDR: tcp://proxy:5557
      REFERENCE_ADDR: tcp://reference:5559
      DB_PATH: /data/server.db
      HEARTBEAT_EVERY: "10"             # heartbeat a cada 10 mensagens de clientes (spec)
      # Simula um relógio físico 3 s adiantado para demonstrar a sincronização
      # (todos os containers compartilham o relógio real). Use "0" para desativar.
      SERVER_CLOCK_SKEW_MS: "3000"
    volumes:
      - server1_data:/data
    depends_on: [reference, broker, proxy]

  # Servidor 2 - só sobe com --profile multi.
  # ATENÇÃO: os bancos NÃO são replicados; com 2 servidores o broker alterna
  # as requisições e cada um enxerga apenas os seus canais/mensagens.
  server2:
    profiles: ["multi"]
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      SERVER_NAME: server2
      BROKER_ADDR: tcp://broker:5556
      PUB_ADDR: tcp://proxy:5557
      REFERENCE_ADDR: tcp://reference:5559
      DB_PATH: /data/server.db
      HEARTBEAT_EVERY: "10"
      SERVER_CLOCK_SKEW_MS: "-2000"     # 2 s atrasado (demonstração)
    volumes:
      - server2_data:/data
    depends_on: [reference, broker, proxy]

  # Bots (clientes Java). 3 réplicas, cada uma com nome aleatório diferente.
  # Comportamento padronizado: 5 canais, 3 inscrições, rajadas de 10 mensagens (1/s).
  client:
    build: { context: ., dockerfile: client/Dockerfile }
    environment:
      BROKER_ADDR: tcp://broker:5555
      SUB_ADDR: tcp://proxy:5558
      MIN_CHANNELS: "5"
      MIN_SUBSCRIPTIONS: "3"
      BURST_SIZE: "10"
      MESSAGE_INTERVAL_MS: "1000"
    deploy:
      replicas: 3
    depends_on: [broker, proxy, server1]

volumes:
  server1_data:
  server2_data:
