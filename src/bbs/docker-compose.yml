#   docker compose up --build cria o broker + 1 servidor + 3 bots
#   docker compose --profile multi up --build adiciona o server2
services:
  broker:
    build: { context: ., dockerfile: broker/Dockerfile }

  # servidor sqlite pra guardar as mensagens
  server1:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      SERVER_NAME: server1
      BROKER_ADDR: tcp://broker:5556
      DB_PATH: /data/server.db
    volumes:
      - server1_data:/data
    depends_on: [broker]

  server2:
    profiles: ["multi"]
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      SERVER_NAME: server2
      BROKER_ADDR: tcp://broker:5556
      DB_PATH: /data/server.db
    volumes:
      - server2_data:/data
    depends_on: [broker]

  # bots
  client:
    build: { context: ., dockerfile: client/Dockerfile }
    environment:
      BROKER_ADDR: tcp://broker:5555
      MIN_CHANNELS: "3"
      INTERVAL_SECONDS: "10"
    deploy:
      replicas: 3
    depends_on: [broker, server1]

volumes:
  server1_data:
  server2_data:
